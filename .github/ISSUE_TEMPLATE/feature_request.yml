name: Feature request
description: Suggest a focused improvement that keeps Portal read-only.
title: "feature: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: scope
    attributes:
      label: Project scope
      options:
        - label: This request keeps the official portal integration read-only.
          required: true
        - label: This request contains no private student or account information.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain the student need rather than only describing a button or screen.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe a simple version that would be useful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Accessibility
        - Offline use
        - Personal information
        - Academic records
        - Financial records
        - Checklist
        - Settings
        - Updates
        - Developer experience
        - Other
    validations:
      required: true
