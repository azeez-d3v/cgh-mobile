version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Manila
    target-branch: development
    open-pull-requests-limit: 5
    groups:
      expo-compatible-development:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "03:30"
      timezone: Asia/Manila
    target-branch: development
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
