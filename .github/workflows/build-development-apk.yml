name: Build Development APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-apk
  cancel-in-progress: true

jobs:
  build:
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_APP_ENV: development
      EXPO_NO_DOTENV: "1"
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a,armeabi-v7a
    steps:
      - name: Checkout development
        uses: actions/checkout@v6
        with:
          ref: development

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: "false"

      - name: Install and validate
        run: |
          npm ci
          npm run validate

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore native compiler cache
        uses: actions/cache@v6
        with:
          path: |
            android/app/.cxx
            node_modules/expo-modules-core/android/.cxx
            node_modules/react-native-reanimated/android/.cxx
            node_modules/react-native-worklets/android/.cxx
          key: portal-cxx-v1-${{ runner.os }}-${{ env.APP_VARIANT }}-${{ hashFiles('package-lock.json', 'patches/*.patch', 'plugins/*.js') }}

      - name: Build development APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --build-cache --parallel

      - name: Upload development APK
        uses: actions/upload-artifact@v7
        with:
          name: CGH-Mobile-Development
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
