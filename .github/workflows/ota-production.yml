name: OTA Production

on:
  workflow_dispatch:
    inputs:
      message:
        description: Update message
        required: true
        default: Production update

permissions:
  contents: read

concurrency:
  group: ota-production
  cancel-in-progress: false

jobs:
  update:
    environment: production
    env:
      UPDATE_MESSAGE: ${{ inputs.message }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout production
        uses: actions/checkout@v6
        with:
          ref: production

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run validate

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish production OTA
        run: eas update --channel production --environment production --message "${UPDATE_MESSAGE}" --non-interactive
