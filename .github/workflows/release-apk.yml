name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
      notes:
        description: Release notes
        required: true
        default: Portal production release

permissions:
  contents: read

concurrency:
  group: production-apk
  cancel-in-progress: false

jobs:
  release:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_APP_ENV: production
      EXPO_NO_DOTENV: "1"
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a,armeabi-v7a
      ORG_GRADLE_PROJECT_CGH_UPLOAD_STORE_FILE: cgh-mobile-release.jks
      ORG_GRADLE_PROJECT_CGH_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_CGH_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_CGH_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout production
        uses: actions/checkout@v7
        with:
          ref: production

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Production is not the repository's default branch, so setup-gradle
          # would otherwise restore caches without saving this build's outputs.
          cache-read-only: "false"

      - name: Install dependencies
        run: npm ci

      - name: Validate release source
        run: |
          npm run version:check -- "$RELEASE_VERSION"
          npm run validate

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore native compiler cache
        uses: actions/cache@v6
        with:
          path: |
            android/app/.cxx
            node_modules/expo-modules-core/android/.cxx
            node_modules/react-native-reanimated/android/.cxx
            node_modules/react-native-worklets/android/.cxx
          key: portal-cxx-v1-${{ runner.os }}-${{ env.APP_VARIANT }}-${{ hashFiles('package-lock.json', 'patches/*.patch', 'plugins/*.js') }}

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/cgh-mobile-release.jks

      - name: Build signed production APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --build-cache --parallel

      - name: Verify and checksum APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk CGH-Mobile.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "Android apksigner was not found" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs CGH-Mobile.apk
          sha256sum CGH-Mobile.apk > CGH-Mobile.apk.sha256

      - name: Archive private R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping-v${{ inputs.version }}
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to public download repository
        run: |
          gh release create "v${RELEASE_VERSION}" \
            "CGH-Mobile.apk#Portal v${RELEASE_VERSION}" \
            "CGH-Mobile.apk.sha256#SHA-256 checksum" \
            --repo azeez-d3v/cgh-mobile-downloads \
            --title "Portal v${RELEASE_VERSION}" \
            --notes "${RELEASE_NOTES}" \
            --latest
